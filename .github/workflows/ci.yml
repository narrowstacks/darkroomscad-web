name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC token exchange for Turborepo remote cache
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Exchanges the GitHub OIDC token for a short-lived Vercel remote-cache token
      # (no long-lived secret). Needs a "Turborepo CLI" OIDC policy on the Vercel team
      # and a TURBO_TEAM repo variable; until those exist this step fails softly and
      # turbo just runs uncached.
      - name: Set up Turborepo remote cache
        uses: vercel/setup-turborepo-remote-cache-action@v1.1.0
        continue-on-error: true
        with:
          team: ${{ vars.TURBO_TEAM }}
      - run: bun run check
